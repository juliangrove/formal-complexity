project:
  type: website
  output-dir: ../docs/notes
  render:
    - about.qmd
    - index.qmd
    - formal_preliminaries/*
    - regular_languages/*

website:
  title: "Formal complexity"
  page-navigation: true
  sidebar:
    style: docked
    search: true
    contents:
    - about.qmd
    - index.qmd
    - section: "Formal preliminaries"
      contents:
        - formal_preliminaries/sets.qmd
        - formal_preliminaries/products.qmd
        - formal_preliminaries/relations.qmd
        - formal_preliminaries/functions.qmd
        - formal_preliminaries/languages.qmd
        - formal_preliminaries/examples.qmd
        - formal_preliminaries/assignment1.qmd
    - section: "Regular languages"
      contents:
        - regular_languages/definition.qmd
        - regular_languages/assignment2.qmd
        - regular_languages/dfas.qmd
        - regular_languages/nfas.qmd
        - regular_languages/equivalence.qmd
    - section: "Context-free languages"
    - section: "Context-sensitivity"
    - section: "Mild context-sensitivity"
    - section: "Recursive and recursively enumerable languages"

format:
  html:
    theme: [lux,tufte]
    highlight-style: gruvbox-dark
    css: styles.css
    toc: true
    code-tools: true

# filters:
  # - line-highlight
